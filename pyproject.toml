[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinwater-timesat-s2-chla"
version = "0.2.0"
description = "Frozen Erken temporal-reconstruction benchmark infrastructure and Sentinel-2 observation diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Zhanzhang Cai" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "pyproj>=3.5",
  "rasterio>=1.3,<1.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
